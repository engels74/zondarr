name: Biome repair
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: biome-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  repair:
    uses: edbfi/automation/.github/workflows/biome-repair.yml@v1.0.0
    with:
      config-files: |
        biome.json
        frontend/biome.json
      source-roots: |
        frontend/src
        frontend/vite.config.ts
        frontend/vitest-setup.ts
        frontend/svelte.config.js
        frontend/uno.config.ts
        frontend/tsconfig.json
      bun-version: 1.4.2
      package-directory: frontend
'on':
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
