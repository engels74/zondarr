name: ci
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: engels74/automation/actions/dispatch-guard@v1.0.0
      with:
        token: ${{ github.token }}
        pr-number: ${{ inputs.pr-number }}
        expected-head-sha: ${{ inputs.expected-head-sha }}
  python:
    needs: guard
    uses: engels74/automation/.github/workflows/python.yml@v1.0.0
    with:
      version: '3.14'
      command: bash .github/scripts/check-python.sh
      timeout-minutes: 30
  frontend:
    needs: guard
    uses: engels74/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      working-directory: frontend
      command: bun run check:biome && bun run check && bun run test
  integration:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: frontend/package.json
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.20.0
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        version: 0.12.10
        enable-cache: true
    - uses: actions/cache@v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('frontend/bun.lock') }}
    - name: Install frozen application dependencies
      run: |-
        bun install --cwd frontend --frozen-lockfile
        uv sync --project backend --frozen --all-extras
    - name: Build frontend and verify generated API declarations
      run: |-
        bun run --cwd frontend build
        bun .github/scripts/check-api.ts
    - name: Smoke both production servers and migrations
      run: python .github/scripts/smoke.py
    - name: Reject tracked-file mutation
      run: git diff --exit-code HEAD
  hygiene:
    needs: guard
    uses: engels74/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: SKIP=no-commit-to-branch,biome,ruff-check,ruff-format bunx --no-install prek run --all-files --hook-stage
        manual
  required:
    name: ci / required
    if: always()
    needs:
    - guard
    - python
    - frontend
    - integration
    - hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: engels74/automation/actions/dispatch-guard@v1.0.0
      with:
        token: ${{ github.token }}
        pr-number: ${{ inputs.pr-number }}
        expected-head-sha: ${{ inputs.expected-head-sha }}
    - uses: engels74/automation/actions/gate@v1.0.0
      with:
        needs: ${{ toJSON(needs) }}
        required: guard python frontend integration hygiene
