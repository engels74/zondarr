[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.14"
pythonPlatform = "All"
extraPaths = [".."]

[tool.ruff]
extend = "../backend/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# Assertions and synthetic credentials are intentional in isolated launcher tests.
"tests/**" = ["S101", "S105", "S106"]
# Internal subprocess state assertions; they are not input validation.
"runner.py" = ["S101"]
